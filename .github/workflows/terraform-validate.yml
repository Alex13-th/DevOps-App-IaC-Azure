name: Terraform Validate
run-name: ${{ github.actor }} · ${{ github.ref_name }}

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Швидкі sanity-check-и під твою структуру
      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail
          # RG у root
          grep -q 'resource "azurerm_resource_group"' main.tf || (echo "RG resource not found in main.tf" && exit 1)

          # STORAGE винос у data (а не resource)
          grep -q 'data "azurerm_storage_account"' modules/storage/main.tf || (echo "data azurerm_storage_account not found in modules/storage/main.tf" && exit 1)
          grep -q 'data "azurerm_storage_container"' modules/storage/main.tf || (echo "data azurerm_storage_container not found in modules/storage/main.tf" && exit 1)

          # NETWORK ресурси
          grep -q 'resource "azurerm_virtual_network"' modules/network/main.tf || (echo "VNet resource missing" && exit 1)
          grep -q 'resource "azurerm_subnet"' modules/network/main.tf || (echo "Subnet resource missing" && exit 1)
          grep -q 'resource "azurerm_network_security_group"' modules/network/main.tf || (echo "NSG resource missing" && exit 1)
          grep -q 'resource "azurerm_public_ip"' modules/network/main.tf || (echo "Public IP resource missing" && exit 1)

          # COMPUTE ресурси: VM (linux_)?virtual_machine, NIC, Extension
          egrep -q 'resource "azurerm_(linux_)?virtual_machine"' modules/compute/main.tf || (echo "VM resource missing" && exit 1)
          grep -q 'resource "azurerm_network_interface"' modules/compute/main.tf || (echo "NIC resource missing" && exit 1)
          grep -q 'resource "azurerm_virtual_machine_extension"' modules/compute/main.tf || (echo "VM extension resource missing" && exit 1)

          echo "Sanity checks OK"

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
